name: Feature request
description: 새로운 schema, runtime 또는 adapter 기능을 제안해주세요.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: 사용 사례
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: JSON과 code API가 어떻게 보일지 예시를 포함해주세요.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 호환성
      description: 기존 Clotho v1 문서와 adapter에 미치는 영향을 적어주세요.
